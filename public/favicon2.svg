<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect x="10" y="10" width="180" height="180" rx="45" fill="#1a2980"/>
  <rect x="10" y="10" width="180" height="180" rx="45" fill="url(#glow)"/>
  
  <!-- 地球主体 -->
  <circle cx="100" cy="100" r="55" fill="url(#earthGrad)"/>
  
  <!-- 经线 -->
  <ellipse cx="100" cy="100" rx="20" ry="55" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <ellipse cx="100" cy="100" rx="45" ry="55" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  
  <!-- 纬线 -->
  <line x1="45" y1="100" x2="155" y2="100" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <ellipse cx="100" cy="100" rx="55" ry="20" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  
  <!-- 连接节点 -->
  <circle cx="70" cy="75" r="5" fill="#ffeb3b"/>
  <circle cx="130" cy="85" r="5" fill="#ff5722"/>
  <circle cx="85" cy="130" r="5" fill="#4caf50"/>
  <circle cx="125" cy="125" r="5" fill="#e91e63"/>
  
  <!-- 连接线 -->
  <path d="M 70 75 Q 100 60 130 85" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,3"/>
  <path d="M 85 130 Q 110 145 125 125" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,3"/>
</svg>