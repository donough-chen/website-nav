<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角背景 -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#mainGrad)"/>
  
  <!-- 三个书签堆叠效果 -->
  <path d="M 60 50 L 60 145 L 85 125 L 110 145 L 110 50 Z" 
        fill="#ffffff" opacity="0.4" transform="translate(-8, 8)"/>
  <path d="M 60 50 L 60 145 L 85 125 L 110 145 L 110 50 Z" 
        fill="#ffffff" opacity="0.7" transform="translate(15, -5)"/>
  <path d="M 60 50 L 60 145 L 85 125 L 110 145 L 110 50 Z" 
        fill="#ffffff"/>
  
  <!-- 中间星星 -->
  <polygon points="85,75 89,85 100,85 91,92 94,103 85,96 76,103 79,92 70,85 81,85" 
           fill="#fa709a"/>
  
  <!-- 装饰圆点 -->
  <circle cx="145" cy="60" r="6" fill="#ffffff" opacity="0.8"/>
  <circle cx="155" cy="80" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="150" cy="140" r="5" fill="#ffffff" opacity="0.7"/>
</svg>