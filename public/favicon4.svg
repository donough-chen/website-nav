<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角背景 -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#grad1)"/>
  
  <!-- 九宫格图标 -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#ffffff" opacity="0.9"/>
    <rect x="45" y="0" width="30" height="30" rx="6" fill="#ffffff" opacity="0.7"/>
    <rect x="90" y="0" width="30" height="30" rx="6" fill="#ffffff" opacity="0.9"/>
    
    <rect x="0" y="45" width="30" height="30" rx="6" fill="#ffffff" opacity="0.7"/>
    <!-- 中间指南针 -->
    <circle cx="60" cy="60" r="22" fill="url(#grad2)"/>
    <polygon points="60,45 65,60 60,75 55,60" fill="#ffffff"/>
    <circle cx="60" cy="60" r="3" fill="#ffffff"/>
    
    <rect x="90" y="45" width="30" height="30" rx="6" fill="#ffffff" opacity="0.7"/>
    
    <rect x="0" y="90" width="30" height="30" rx="6" fill="#ffffff" opacity="0.9"/>
    <rect x="45" y="90" width="30" height="30" rx="6" fill="#ffffff" opacity="0.7"/>
    <rect x="90" y="90" width="30" height="30" rx="6" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>