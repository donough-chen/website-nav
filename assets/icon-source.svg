<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#667eea"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方形 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 虚线连接圆环 -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" opacity="0.35"/>

  <!-- 四个方块 -->
  <rect x="8"  y="8"  width="18" height="18" rx="4" fill="url(#g1)"/>
  <rect x="38" y="8"  width="18" height="18" rx="4" fill="url(#g2)"/>
  <rect x="8"  y="38" width="18" height="18" rx="4" fill="url(#g3)"/>
  <rect x="38" y="38" width="18" height="18" rx="4" fill="url(#g2)"/>

  <!-- 方块内小图标 -->
  <circle cx="17" cy="17" r="3" fill="#667eea"/>
  <rect x="41" y="14" width="9"  height="2" rx="1" fill="#ffffff"/>
  <rect x="41" y="18" width="6"  height="2" rx="1" fill="#ffffff"/>
  <path d="M12 47 L16 51 L22 43" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="46" r="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <line x1="47" y1="48" x2="50" y2="51" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 中心聚合点 -->
  <circle cx="32" cy="32" r="7" fill="#ffffff"/>
  <circle cx="32" cy="32" r="5.5" fill="url(#center)"/>
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>
</svg>