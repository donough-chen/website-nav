<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 图标部分：聚合方块 + 中心圆 -->
  <g transform="translate(15, 20)">
    <!-- 外圈连接线（表示聚合） -->
    <circle cx="40" cy="40" r="35" fill="none" stroke="url(#grad1)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
    
    <!-- 四个方块（代表聚合的网站） -->
    <rect x="5" y="5" width="26" height="26" rx="6" fill="url(#grad1)"/>
    <rect x="49" y="5" width="26" height="26" rx="6" fill="url(#grad2)"/>
    <rect x="5" y="49" width="26" height="26" rx="6" fill="url(#grad3)"/>
    <rect x="49" y="49" width="26" height="26" rx="6" fill="url(#grad2)"/>
    
    <!-- 方块内小图标 -->
    <circle cx="18" cy="18" r="4" fill="white" opacity="0.9"/>
    <rect x="57" y="14" width="10" height="2.5" rx="1" fill="white" opacity="0.9"/>
    <rect x="57" y="19" width="7" height="2.5" rx="1" fill="white" opacity="0.9"/>
    <path d="M13 58 L18 63 L23 55" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="62" cy="62" r="4" fill="none" stroke="white" stroke-width="2"/>
    <line x1="65" y1="65" x2="68" y2="68" stroke="white" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 中心聚合点 -->
    <circle cx="40" cy="40" r="10" fill="white"/>
    <circle cx="40" cy="40" r="8" fill="url(#textGrad)"/>
    <circle cx="40" cy="40" r="3" fill="white"/>
  </g>

  <!-- 文字部分 -->
  <g transform="translate(110, 0)">
    <text x="0" y="55" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="28" font-weight="bold" fill="url(#textGrad)">聚合导航</text>
    <text x="2" y="82" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#888" letter-spacing="2">NAVIGATION HUB</text>
    <line x1="0" y1="90" x2="160" y2="90" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>