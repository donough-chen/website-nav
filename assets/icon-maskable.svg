<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <!-- 四个方块的渐变 -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#667eea"/>
    </linearGradient>
    <!-- 装饰光晕 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 铺满整个 512×512 画布的背景 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- 装饰性光晕（安全区外，可被裁切） -->
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- ============================================
       内容居中在 40% 安全区
       安全区范围：x/y from 160 to 352（尺寸 192×192）
       中心点：(256, 256)
  ============================================= -->

  <!-- 虚线连接圆环 -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,6" opacity="0.35"/>

  <!-- 四个方块 -->
  <rect x="160" y="160" width="80" height="80" rx="14" fill="url(#g1)"/>
  <rect x="272" y="160" width="80" height="80" rx="14" fill="url(#g2)"/>
  <rect x="160" y="272" width="80" height="80" rx="14" fill="url(#g3)"/>
  <rect x="272" y="272" width="80" height="80" rx="14" fill="url(#g2)"/>

  <!-- 左上方块：圆点图标 -->
  <circle cx="200" cy="200" r="14" fill="#667eea"/>

  <!-- 右上方块：列表图标 -->
  <rect x="286" y="188" width="42" height="8" rx="4" fill="#ffffff"/>
  <rect x="286" y="204" width="30" height="8" rx="4" fill="#ffffff"/>
  <rect x="286" y="220" width="36" height="8" rx="4" fill="#ffffff"/>

  <!-- 左下方块：对勾图标 -->
  <path d="M178 313 L194 329 L222 299" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右下方块：搜索图标 -->
  <circle cx="306" cy="308" r="13" fill="none" stroke="#ffffff" stroke-width="7"/>
  <line x1="316" y1="318" x2="326" y2="328" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

  <!-- 中心聚合点 -->
  <circle cx="256" cy="256" r="32" fill="#ffffff"/>
  <circle cx="256" cy="256" r="25" fill="url(#center)"/>
  <circle cx="256" cy="256" r="9" fill="#ffffff"/>
</svg>